services:
  orders-db:
    image: postgres:17-alpine
    container_name: orders-db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    volumes:
      - orders_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    build: ./services/orders
    image: ticketflow/orders:latest
    container_name: orders
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://ticketflow:ticketflow@orders-db:5432/orders?sslmode=disable
    ports:
      - "8081:8080"
    depends_on:
      orders-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  orders_db_data:
